aid: doctorly
name: Doctorly
description: >-
  Doctorly (doctorly GmbH, Berlin) builds a modern cloud-based practice
  management system (Praxisverwaltungssystem / PVS) for medical practices in
  Germany, positioned as a replacement for legacy systems such as Medistar,
  Turbomed and ALBIS. The platform covers KV quarterly billing, e-prescription
  (eRezept), electronic sick leave (eAU), real-time collaborative patient
  records, GDT device integration and cross-platform access on Windows, macOS,
  Linux and Android, and it is KBV-, gematik- and GDPR-compliant. Doctorly is a
  Seedcamp portfolio company. As of this profile the company exposes no public
  developer portal, API documentation, OpenAPI/FHIR specification, SDKs or
  GitHub organization; this entry is maintained as a company/provider record in
  the API Evangelist network.
